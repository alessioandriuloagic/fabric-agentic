name: Validate rail contract

on:
  pull_request:
    paths:
      - "schemas/**"
      - "scripts/**"
      - "fabric_agentic/**"
      - "tests/**"
      - "profiles/**"
      - "fabric/notebook/**"
      - "attachments/**"
      - ".github/workflows/pipe_agent_branch_out.yml"
      - ".github/workflows/pipe_agent_sync_workspace.yml"
      - ".github/workflows/pipe_agent_crm_preflight.yml"
      - ".github/workflows/validate-rail-contract.yml"
  push:
    branches:
      - main
    paths:
      - "schemas/**"
      - "scripts/**"
      - "fabric_agentic/**"
      - "tests/**"
      - "profiles/**"
      - "fabric/notebook/**"
      - "attachments/**"
      - ".github/workflows/pipe_agent_branch_out.yml"
      - ".github/workflows/pipe_agent_sync_workspace.yml"
      - ".github/workflows/pipe_agent_crm_preflight.yml"
      - ".github/workflows/validate-rail-contract.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate rail-result schema
        run: python scripts/validate_rail_result_schema.py
      - name: Test deterministic rail helpers
        run: python -m unittest tests/test_branch_out.py tests/test_sync_workspace.py tests/test_crm_framework.py tests/test_fabric_artifacts.py tests/test_fabric_crm_preflight.py tests/test_pagamenti_load.py tests/test_package.py tests/test_connectors.py tests/test_control.py tests/test_render.py tests/test_polling.py tests/test_config_paths.py tests/test_agent_session.py tests/test_instance_profile.py tests/test_review_vote_publish.py tests/test_review_dispatcher.py tests/test_issue_package_publish.py tests/test_issue_dispatcher.py tests/test_dev_dispatcher.py tests/test_tracker.py
