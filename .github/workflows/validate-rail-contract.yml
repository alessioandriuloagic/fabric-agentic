name: Validate rail contract

on:
  pull_request:
    paths:
      - "schemas/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/branch-out.yml"
      - ".github/workflows/sync-workspace.yml"
      - ".github/workflows/crm-preflight.yml"
      - ".github/workflows/validate-rail-contract.yml"
  push:
    branches:
      - main
    paths:
      - "schemas/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/branch-out.yml"
      - ".github/workflows/sync-workspace.yml"
      - ".github/workflows/crm-preflight.yml"
      - ".github/workflows/validate-rail-contract.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate rail-result schema
        run: python scripts/validate_rail_result_schema.py
      - name: Test deterministic rail helpers
        run: python -m unittest tests/test_branch_out.py tests/test_sync_workspace.py tests/test_crm_framework.py tests/test_fabric_artifacts.py tests/test_fabric_crm_preflight.py
