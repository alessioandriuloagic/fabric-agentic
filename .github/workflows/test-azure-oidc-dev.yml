name: Test Azure OIDC DEV

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  verify-identity:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Read DEV workspace metadata
        run: |
          az rest \
            --method get \
            --url "https://api.fabric.microsoft.com/v1/workspaces/abb3a689-6a8a-4a98-88da-b3f7c6de05c5" \
            --resource "https://api.fabric.microsoft.com" \
            --query "{id:id,displayName:displayName,type:type}" \
            --output json