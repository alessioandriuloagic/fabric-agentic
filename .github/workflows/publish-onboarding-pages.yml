name: Publish onboarding page

on:
  push:
    branches: [main]
    paths:
      - "onboarding/**"
      - "fabric_agentic/bootstrap.py"
      - "fabric_agentic/instance_profile.py"
      - "fabric_agentic/connectors.py"
      - "scripts/build_onboarding_site.py"
      - ".github/workflows/publish-onboarding-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build static onboarding page
        run: python -m scripts.build_onboarding_site --output _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4