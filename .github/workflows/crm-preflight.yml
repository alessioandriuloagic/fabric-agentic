name: CRM preflight

on:
  workflow_dispatch:
    inputs:
      work_item_id:
        description: Azure Boards work item ID for the feature workspace
        required: true
        type: number

permissions:
  contents: read
  id-token: write

jobs:
  crm-preflight:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Check out main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.FABRIC_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.FABRIC_DEPLOY_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Create artifacts and run CRM preflight
        id: preflight
        continue-on-error: true
        run: python scripts/fabric_crm_preflight.py --work-item-id "${{ inputs.work_item_id }}"

      - name: Publish preflight result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crm-preflight-result
          path: crm-preflight-result.json
          if-no-files-found: error

      - name: Fail after publishing the preflight result
        if: steps.preflight.outcome == 'failure'
        run: exit 1
