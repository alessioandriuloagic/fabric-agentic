[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fabric-agentic"
version = "0.1.0"
description = "Reusable delivery kit for agentic Microsoft Fabric projects"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = []

[project.optional-dependencies]
agents = ["pyjwt>=2.8", "cryptography>=42"]

[project.scripts]
fabric-agentic = "fabric_agentic.cli:main"

[tool.setuptools]
packages = ["fabric_agentic"]
